# Temporary / manual: SSH to prod and capture why Channel ROI fails to load.
# Read-only against the live DB (HTTP probe + log greps only). No create_app.
# Prefer closing this PR unmerged once RCA is done; keep as workflow_dispatch only.
name: Diagnose Channel ROI

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Probe Channel ROI on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "$VPS_HOST_KEY" >> ~/.ssh/known_hosts

      - name: Run Channel ROI diagnostics on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          echo "=== host memory / gunicorn ==="
          awk '/MemAvailable|MemTotal|SwapTotal|SwapFree/ {print}' /proc/meminfo
          systemctl is-active gunicorn || true
          systemctl show gunicorn -p MainPID -p NRestarts -p ExecMainStatus --no-pager 2>/dev/null || true
          ps -o pid,rss,cmd -C gunicorn --no-headers 2>/dev/null | head -10 || true
          echo
          echo "=== alembic + channel_roi tables ==="
          psql -U app_user -h localhost -d real_estate_analysis -c "SELECT version_num FROM alembic_version;"
          psql -U app_user -h localhost -d real_estate_analysis -c "SELECT count(*) AS config_rows FROM channel_roi_config; SELECT count(*) AS fb_rows FROM facebook_ad_campaigns; SELECT count(*) AS mail_active FROM mail_campaigns WHERE status <> 'cancelled';"
          echo
          echo "=== authenticated GET /api/marketing/channel-roi via gunicorn ==="
          cd /home/deploy/app/backend
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
          # Prefer gunicorn's venv; fall back to system python3.11 / python3.
          if [ -x /home/deploy/app/backend/.venv/bin/python ]; then
            PY=/home/deploy/app/backend/.venv/bin/python
          elif command -v python3.11 >/dev/null 2>&1; then
            PY=python3.11
          else
            PY=python3
          fi
          echo "using interpreter: $PY"
          "$PY" - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          try:
              import jwt
          except Exception as exc:
              print("IMPORT_FAIL", type(exc).__name__)
              sys.exit(1)

          secret = os.environ.get("SECRET_KEY") or os.environ.get("JWT_SECRET_KEY")
          if not secret:
              print("NO_SECRET_KEY")
              sys.exit(1)

          user_uuid = None
          email = "diag@local"
          is_admin = False
          try:
              import psycopg2

              url = os.environ["DATABASE_URL"]
              dsn = url.replace("postgresql+psycopg2://", "postgresql://")
              conn = psycopg2.connect(dsn)
              cur = conn.cursor()
              cur.execute(
                  "SELECT user_id, email, COALESCE(is_admin, FALSE) FROM users "
                  "WHERE is_active IS TRUE ORDER BY is_admin DESC, id ASC LIMIT 1"
              )
              row = cur.fetchone()
              if row:
                  user_uuid, email, is_admin = row[0], row[1], bool(row[2])
              cur.close()
              conn.close()
              # Redact email in CI logs — keep id + admin flag only.
              print("user_id", user_uuid, "is_admin", is_admin)
          except Exception as exc:
              print("user_lookup_failed", type(exc).__name__)
              sys.exit(1)

          if not user_uuid:
              print("NO_ACTIVE_USER")
              sys.exit(1)

          now = int(time.time())
          token = jwt.encode(
              {
                  "sub": user_uuid,
                  "email": email,
                  "is_admin": is_admin,
                  "exp": now + 600,
                  "iat": now,
              },
              secret,
              algorithm="HS256",
          )
          if isinstance(token, bytes):
              token = token.decode()

          req = urllib.request.Request(
              "http://127.0.0.1:5000/api/marketing/channel-roi",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  body = resp.read().decode("utf-8", errors="replace")
                  status = int(resp.status)
                  print("HTTP", status)
                  try:
                      payload = json.loads(body)
                      if isinstance(payload, dict):
                          print("keys=", sorted(payload.keys()))
                          channels = payload.get("channels")
                          if isinstance(channels, list):
                              print("channel_count=", len(channels))
                          elif isinstance(channels, dict):
                              print("channel_keys=", sorted(channels.keys())[:20])
                      else:
                          print("body_type=", type(payload).__name__)
                  except json.JSONDecodeError:
                      print("non_json_body_len=", len(body))
                  if status != 200:
                      sys.exit(1)
          except urllib.error.HTTPError as exc:
              print("HTTP", int(exc.code))
              err_body = exc.read().decode("utf-8", errors="replace") if exc.fp else ""
              print("error_body_len=", len(err_body))
              # Keep a short non-secret snippet for triage (no full ROI/PII dump).
              print("error_body_head=", err_body[:200].replace("\n", " "))
              sys.exit(1)
          except Exception as exc:
              print("REQUEST_FAIL", type(exc).__name__, str(exc)[:200])
              sys.exit(1)
          PY
          echo
          echo "=== nginx access/error for channel-roi + 502/504 (recent) ==="
          for f in /var/log/nginx/access.log /var/log/nginx/bbanalyzer.access.log /var/log/nginx/error.log /var/log/nginx/bbanalyzer.error.log; do
            if [ -r "$f" ]; then
              echo "-- $f --"
              grep -iE 'channel-roi|502|504|upstream' "$f" | tail -40 || true
            else
              echo "-- $f not readable --"
            fi
          done
          sudo -n journalctl -u nginx --since "24 hours ago" --no-pager 2>/dev/null \
            | grep -iE '502|504|upstream timed out|connect\(\) failed' | tail -40 || true
          echo
          echo "=== gunicorn restart reason (last 50) ==="
          journalctl -u gunicorn --since "24 hours ago" --no-pager 2>/dev/null \
            | grep -iE 'Started|Stopping|Worker|boot|OOM|Killed|signal|ERROR' | tail -50 || true
          echo
          echo "=== gunicorn journal (channel-roi / traceback) last 24h ==="
          journalctl -u gunicorn --since "24 hours ago" --no-pager 2>/dev/null \
            | grep -iE 'channel[-_]roi|/marketing/channel|FacebookAdCampaign|Traceback|Error|WORKER TIMEOUT|oom' \
            | tail -100 || true
          echo
          echo "=== errors.log / app.log tails ==="
          tail -100 /home/deploy/app/backend/logs/errors.log 2>/dev/null || echo NO_ERRORS_LOG
          echo "---"
          grep -iE 'channel|roi|marketing' /home/deploy/app/backend/logs/errors.log 2>/dev/null | tail -40 || true
          REMOTE
