# Temporary one-shot: SSH to prod and capture why Channel ROI fails to load.
# Safe/read-only against the live DB (get_dashboard + log greps only).
name: Diagnose Channel ROI

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-channel-roi.yml'
  workflow_dispatch:

jobs:
  diagnose:
    name: Probe Channel ROI on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "$VPS_HOST_KEY" >> ~/.ssh/known_hosts

      - name: Run Channel ROI diagnostics on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -uo pipefail
          echo "=== host memory / gunicorn ==="
          awk '/MemAvailable|MemTotal|SwapTotal|SwapFree/ {print}' /proc/meminfo
          systemctl is-active gunicorn || true
          systemctl show gunicorn -p MainPID -p NRestarts -p ExecMainStatus --no-pager 2>/dev/null || true
          ps -o pid,rss,cmd -C gunicorn --no-headers 2>/dev/null | head -10 || true
          echo
          echo "=== alembic + channel_roi tables ==="
          psql -U app_user -h localhost -d real_estate_analysis -c "SELECT version_num FROM alembic_version;"
          psql -U app_user -h localhost -d real_estate_analysis -c "SELECT count(*) AS config_rows FROM channel_roi_config; SELECT count(*) AS fb_rows FROM facebook_ad_campaigns; SELECT count(*) AS mail_active FROM mail_campaigns WHERE status <> 'cancelled';"
          echo
          echo "=== which python has flask ==="
          export PATH="$HOME/.local/bin:$PATH"
          which python3 python3.11 flask gunicorn 2>/dev/null || true
          python3 -c "import flask; print('python3 flask', flask.__version__)" 2>&1 || true
          python3.11 -c "import flask; print('python3.11 flask', flask.__version__)" 2>&1 || true
          ls -la /home/deploy/app/backend/.venv/bin/python 2>&1 || true
          echo
          echo "=== authenticated GET /api/marketing/channel-roi via gunicorn ==="
          cd /home/deploy/app/backend
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
          # Prefer the same interpreter family gunicorn uses (user site-packages).
          PY=python3.11
          command -v "$PY" >/dev/null 2>&1 || PY=python3
          "$PY" - <<'PY'
          import os, sys, traceback, json, time
          # Lightweight: mint JWT the same way AuthService does, then curl via urllib
          # to the already-running gunicorn (avoid create_app OOM on ~80MiB free).
          try:
              import jwt
              import urllib.request
          except Exception as exc:
              print('IMPORT_FAIL', exc)
              sys.exit(0)

          secret = os.environ.get('SECRET_KEY') or os.environ.get('JWT_SECRET_KEY')
          if not secret:
              print('NO_SECRET_KEY')
              sys.exit(0)

          # JWT sub is users.user_id (UUID string), not integer PK.
          user_uuid = None
          email = 'diag@local'
          try:
              import psycopg2
              url = os.environ['DATABASE_URL']
              dsn = url.replace('postgresql+psycopg2://', 'postgresql://')
              conn = psycopg2.connect(dsn)
              cur = conn.cursor()
              cur.execute(
                  "SELECT user_id, email FROM users "
                  "WHERE is_active IS TRUE ORDER BY is_admin DESC, id ASC LIMIT 1"
              )
              row = cur.fetchone()
              if row:
                  user_uuid, email = row[0], row[1]
              cur.close(); conn.close()
              print('user_id', user_uuid, 'email', email)
          except Exception as exc:
              print('user_lookup_failed', type(exc).__name__, exc)

          if not user_uuid:
              print('NO_ACTIVE_USER')
              sys.exit(0)

          now = int(time.time())
          token = jwt.encode(
              {
                  'sub': user_uuid,
                  'email': email,
                  'is_admin': True,
                  'exp': now + 600,
                  'iat': now,
              },
              secret,
              algorithm='HS256',
          )
          if isinstance(token, bytes):
              token = token.decode()

          req = urllib.request.Request(
              'http://127.0.0.1:5000/api/marketing/channel-roi',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'},
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  body = resp.read().decode('utf-8', errors='replace')
                  print('HTTP', resp.status)
                  print(body[:2000])
          except Exception as exc:
              print('REQUEST_FAIL', type(exc).__name__, exc)
              if hasattr(exc, 'read'):
                  try:
                      print(exc.read().decode('utf-8', errors='replace')[:2000])
                  except Exception:
                      pass
              traceback.print_exc()
          PY
          echo
          echo "=== in-process get_dashboard (may OOM under memory pressure) ==="
          "$PY" - <<'PY' || echo "create_app_or_dashboard_failed exit=$?"
          import os, traceback, json
          os.chdir('/home/deploy/app/backend')
          # Load .env already sourced into environ by parent shell
          try:
              from app import create_app
              app = create_app()
              with app.app_context():
                  from app.services.channel_roi_service import ChannelRoiService
                  payload = ChannelRoiService().get_dashboard()
                  print('DASHBOARD_OK keys=', sorted(payload.keys()))
                  print('channels=', json.dumps(payload.get('channels'), default=str)[:500])
          except Exception:
              print('DASHBOARD_FAIL')
              traceback.print_exc()
          PY
          echo
          echo "=== nginx access/error for channel-roi + 502/504 (recent) ==="
          for f in /var/log/nginx/access.log /var/log/nginx/bbanalyzer.access.log /var/log/nginx/error.log /var/log/nginx/bbanalyzer.error.log; do
            if [ -r "$f" ]; then
              echo "-- $f --"
              grep -iE 'channel-roi|502|504|upstream' "$f" | tail -40 || true
            else
              echo "-- $f not readable --"
            fi
          done
          # deploy may have passwordless sudo for journal/nginx
          sudo -n journalctl -u nginx --since "24 hours ago" --no-pager 2>/dev/null \
            | grep -iE '502|504|upstream timed out|connect\\(\\) failed' | tail -40 || true
          echo
          echo "=== gunicorn restart reason (last 50) ==="
          journalctl -u gunicorn --since "24 hours ago" --no-pager 2>/dev/null \
            | grep -iE 'Started|Stopping|Worker|boot|OOM|Killed|signal|ERROR' | tail -50 || true
          echo
          echo "=== gunicorn journal (channel-roi / traceback) last 24h ==="
          journalctl -u gunicorn --since "24 hours ago" --no-pager 2>/dev/null \
            | grep -iE 'channel[-_]roi|/marketing/channel|FacebookAdCampaign|Traceback|Error|WORKER TIMEOUT|oom' \
            | tail -100 || true
          echo
          echo "=== errors.log / app.log tails ==="
          tail -100 /home/deploy/app/backend/logs/errors.log 2>/dev/null || echo NO_ERRORS_LOG
          echo "---"
          grep -iE 'channel|roi|marketing' /home/deploy/app/backend/logs/errors.log 2>/dev/null | tail -40 || true
          REMOTE
