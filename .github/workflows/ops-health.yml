# Ops health — backup / verify / soft readiness + hourly SSH/HTTP canary.
# Never triggers Deploy. Failures open/update a GitHub issue and optionally POST to Slack.
name: Ops health

permissions:
  contents: read
  issues: write
  actions: read

on:
  schedule:
    # Full backup/verify every 6 hours
    - cron: "0 */6 * * *"
    # Lightweight SSH/HTTP canary every hour
    - cron: "0 * * * *"
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
  workflow_dispatch:

jobs:
  # ── Reachability canary (hourly + after Deploy + manual; not on 6h cron) ─
  ops-canary:
    name: VPS SSH/HTTP canary
    runs-on: ubuntu-latest
    # Hourly cron only (avoid double-run with 6h schedule at :00). Also after
    # Deploy and on manual dispatch. Skip cancelled Deploy follow-ups.
    if: >
      (
        github.event_name == 'schedule' &&
        github.event.schedule == '0 * * * *'
      ) || (
        github.event_name == 'workflow_dispatch'
      ) || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion != 'cancelled'
      )

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_HOST_KEY }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: SSH canary
        id: ssh_canary
        continue-on-error: true
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSH_KEY_PATH: /home/runner/.ssh/id_deploy
          SSH_CONNECT_TIMEOUT: "30"
          SSH_MAX_WAIT_SECONDS: "60"
          SSH_INITIAL_BACKOFF: "5"
        run: |
          chmod +x scripts/ci-ssh-verify.sh
          bash scripts/ci-ssh-verify.sh

      - name: HTTP canary
        id: http_canary
        continue-on-error: true
        env:
          VPS_SUBDOMAIN: ${{ secrets.VPS_SUBDOMAIN }}
          HTTP_MAX_WAIT_SECONDS: "90"
          HTTP_SLEEP_SECONDS: "5"
        run: |
          chmod +x scripts/ci-http-health-wait.sh
          HEALTH_URL="https://${VPS_SUBDOMAIN}.duckdns.org/api/health" \
            bash scripts/ci-http-health-wait.sh

      - name: Write canary summary
        if: always()
        run: |
          {
            echo "## Ops canary"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| SSH canary | ${{ steps.ssh_canary.outcome }} |"
            echo "| HTTP canary | ${{ steps.http_canary.outcome }} |"
            echo ""
            echo "Does **not** block App CI or Deploy."
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Count consecutive canary failures and alert
        id: canary_alert
        if: always() && (steps.ssh_canary.outcome == 'failure' || steps.http_canary.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_OUTCOME: ${{ steps.ssh_canary.outcome }}
          HTTP_OUTCOME: ${{ steps.http_canary.outcome }}
          VPS_SUBDOMAIN: ${{ secrets.VPS_SUBDOMAIN }}
        run: |
          set -euo pipefail
          # Count consecutive prior workflow runs whose "VPS SSH/HTTP canary" job failed.
          # Current run counts as 1; walk older completed runs until a success/skipped.
          CONSEC=1
          mapfile -t PRIOR_IDS < <(gh run list \
            --workflow "Ops health" \
            --status completed \
            --limit 20 \
            --json databaseId,conclusion \
            --jq '.[].databaseId')
          for RID in "${PRIOR_IDS[@]}"; do
            if [ "$RID" = "${{ github.run_id }}" ]; then
              continue
            fi
            JOB_JSON=$(gh api "repos/${{ github.repository }}/actions/runs/${RID}/jobs" --paginate 2>/dev/null || echo '{"jobs":[]}')
            CANARY_CONCL=$(echo "$JOB_JSON" | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          for j in data.get('jobs',[]):
            if j.get('name')=='VPS SSH/HTTP canary':
              print(j.get('conclusion') or '')
              break
          " 2>/dev/null || true)
            if [ -z "$CANARY_CONCL" ]; then
              continue
            fi
            if [ "$CANARY_CONCL" = "failure" ]; then
              CONSEC=$((CONSEC + 1))
            elif [ "$CANARY_CONCL" = "success" ]; then
              break
            else
              # skipped/cancelled — ignore and keep walking
              continue
            fi
          done
          echo "Consecutive canary job failures (including this run once it fails): ${CONSEC}"
          echo "consec=${CONSEC}" >> "$GITHUB_OUTPUT"

          if [ "$CONSEC" -lt 2 ]; then
            echo "Single canary miss — no GitHub issue yet (need >=2 consecutive)."
            echo "alert=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "alert=1" >> "$GITHUB_OUTPUT"
          if [ "$SSH_OUTCOME" = "failure" ]; then
            ISSUE_TITLE="Ops health: VPS SSH unreachable"
          else
            ISSUE_TITLE="Ops health: VPS public /api/health down"
          fi
          BODY=$(cat <<EOF
          ## Ops reachability canary failure

          Automated SSH/HTTP canary failed **${CONSEC}** consecutive times.

          | Check | Result |
          |-------|--------|
          | SSH canary | ${SSH_OUTCOME} |
          | HTTP canary | ${HTTP_OUTCOME} |

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Remediation
          1. Confirm VPS is up and \`sshd\` is listening on port 22
          2. Confirm public \`/api/health\` at https://${VPS_SUBDOMAIN}.duckdns.org/api/health
          3. See docs/vps-config.md — Deploy SSH / reachability
          4. Re-run **Ops health** via workflow_dispatch after recovery

          App CI and Deploy are **not** blocked by this issue. Deploy soft-waits ~10m on HTTP then hard-waits ~15m on SSH.
          EOF
          )

          EXISTING=$(gh issue list --label ops-health --state open \
            --search "in:title Ops health: VPS" \
            --json number,title --jq '[.[] | select(.title | test("SSH unreachable|public /api/health down"))] | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Updated issue #$EXISTING"
          else
            gh label create ops-health --description "VPS backup/ops health alerts" --color B60205 2>/dev/null || true
            gh issue create --title "$ISSUE_TITLE" --label ops-health --body "$BODY"
          fi

      - name: Optional Slack webhook (canary)
        if: always() && steps.canary_alert.outputs.alert == '1'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEXT: "Ops canary: VPS unreachable (${{ steps.canary_alert.outputs.consec }} consecutive) on ${{ github.repository }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notify."
            exit 0
          fi
          curl -sS --fail -X POST -H 'Content-type: application/json' \
            --data "$(python3 -c "import json,os; print(json.dumps({'text': os.environ['TEXT']}))")" \
            "$SLACK_WEBHOOK_URL"

      - name: Comment recovery on open reachability issue
        if: always() && steps.ssh_canary.outcome == 'success' && steps.http_canary.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --label ops-health --state open \
            --search "in:title Ops health: VPS" \
            --json number,title --jq '[.[] | select(.title | test("SSH unreachable|public /api/health down"))] | .[0].number // empty')
          if [ -z "$EXISTING" ]; then
            echo "No open reachability issue."
            exit 0
          fi
          BODY=$(cat <<EOF
          ## Reachability recovered

          SSH and public \`/api/health\` canaries succeeded.

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Safe to close this issue if the VPS remains healthy.
          EOF
          )
          gh issue comment "$EXISTING" --body "$BODY"
          echo "Commented recovery on issue #$EXISTING"

      - name: Fail job when canary checks failed
        if: always() && (steps.ssh_canary.outcome == 'failure' || steps.http_canary.outcome == 'failure')
        run: |
          echo "::error::Ops canary failed (advisory — does not block Deploy)."
          exit 1

  # ── Full backup / verify (6h schedule, after Deploy, manual) ───────────────
  ops-health:
    name: VPS backup and readiness
    runs-on: ubuntu-latest
    # Run after Deploy finishes (any conclusion), on 6h schedule, or manually.
    # Skip hourly-only schedule (canary job covers that) and cancelled Deploy follow-ups.
    if: >
      (
        github.event_name == 'workflow_dispatch'
      ) || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion != 'cancelled'
      ) || (
        github.event_name == 'schedule' &&
        github.event.schedule == '0 */6 * * *'
      )

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_HOST_KEY }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run backup.sh --check on VPS
        id: backup_check
        continue-on-error: true
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          OUT=$(ssh -i /home/runner/.ssh/id_deploy \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" \
            "/home/deploy/backup.sh --check" 2>&1) || {
            echo "$OUT"
            echo "::error::backup.sh --check failed on VPS. See docs/vps-config.md"
            echo "backup_failed=1" >> "$GITHUB_OUTPUT"
            exit 1
          }
          echo "$OUT"
          echo "backup_failed=0" >> "$GITHUB_OUTPUT"

      - name: Run backup health verification on VPS
        id: verify_backup
        continue-on-error: true
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          OUT=$(ssh -i /home/runner/.ssh/id_deploy \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" \
            "/home/deploy/verify-backup-health.sh" 2>&1) || {
            echo "$OUT"
            echo "::error::verify-backup-health.sh failed on VPS. See docs/vps-config.md"
            echo "verify_failed=1" >> "$GITHUB_OUTPUT"
            exit 1
          }
          echo "$OUT"
          echo "verify_failed=0" >> "$GITHUB_OUTPUT"

      # Soft only for async-stack ensure (exit 2). Hard failures (SSH, sudo, missing
      # files) still fail this step. Deploy re-ensures without SOFT_ASYNC_ENSURE_FAILURE.
      - name: Run VPS readiness check
        id: readiness
        continue-on-error: true
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_ROOT_SSH_KEY: ${{ secrets.VPS_ROOT_SSH_KEY }}
          SSH_KEY_PATH: /home/runner/.ssh/id_deploy
          SOFT_ASYNC_ENSURE_FAILURE: "1"
        run: |
          chmod +x scripts/ci-ensure-vps-readiness.sh scripts/run-vps-readiness-check.sh
          VPS_USER="$VPS_USER" VPS_HOST="$VPS_HOST" SSH_KEY_PATH="$SSH_KEY_PATH" \
            VPS_ROOT_SSH_KEY="$VPS_ROOT_SSH_KEY" \
            SOFT_ASYNC_ENSURE_FAILURE=1 \
            bash scripts/ci-ensure-vps-readiness.sh

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Ops health"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| backup.sh --check | ${{ steps.backup_check.outcome }} |"
            echo "| verify-backup-health | ${{ steps.verify_backup.outcome }} |"
            echo "| VPS readiness (soft async) | ${{ steps.readiness.outcome }} |"
            echo ""
            echo "This workflow never blocks App CI or Deploy."
            echo "Remediation: [docs/vps-config.md](docs/vps-config.md) — \`backup.sh --check\` fails."
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update ops-health GitHub issue
        if: >
          always() &&
          (steps.backup_check.outcome == 'failure' ||
           steps.verify_backup.outcome == 'failure' ||
           steps.readiness.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "Ops health: backup/verify failing on VPS"
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          ## Ops health failure

          Automated Ops health checks failed.

          | Check | Result |
          |-------|--------|
          | backup.sh --check | ${{ steps.backup_check.outcome }} |
          | verify-backup-health | ${{ steps.verify_backup.outcome }} |
          | VPS readiness (soft async) | ${{ steps.readiness.outcome }} |

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Remediation
          1. SSH to the VPS and run \`tail -50 /home/deploy/logs/backup.log\`
          2. See docs/vps-config.md — \`backup.sh --check\` fails
          3. Fix \`backup.conf\` / cron / credentials; re-run **Ops health** via workflow_dispatch

          App CI and Deploy are **not** blocked by this issue.
          EOF
          )

          EXISTING=$(gh issue list --label ops-health --state open --search "in:title Ops health: backup/verify failing on VPS" --json number,title --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Updated issue #$EXISTING"
          else
            gh label create ops-health --description "VPS backup/ops health alerts" --color B60205 2>/dev/null || true
            gh issue create --title "$ISSUE_TITLE" --label ops-health --body "$BODY"
          fi

      - name: Optional Slack webhook
        if: >
          always() &&
          (steps.backup_check.outcome == 'failure' ||
           steps.verify_backup.outcome == 'failure' ||
           steps.readiness.outcome == 'failure')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEXT: "Ops health failed on ${{ github.repository }} — backup/verify. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notify."
            exit 0
          fi
          curl -sS --fail -X POST -H 'Content-type: application/json' \
            --data "$(python3 -c "import json,os; print(json.dumps({'text': os.environ['TEXT']}))")" \
            "$SLACK_WEBHOOK_URL"

      - name: Fail job when ops checks failed
        if: >
          always() &&
          (steps.backup_check.outcome == 'failure' ||
           steps.verify_backup.outcome == 'failure' ||
           steps.readiness.outcome == 'failure')
        run: |
          echo "::error::Ops health checks failed (advisory — does not block Deploy)."
          exit 1
